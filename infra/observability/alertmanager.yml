global:
  resolve_timeout: 5m

route:
  receiver: rotas-operations
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: rotas-operations
      matchers:
        - severity="critical"
      repeat_interval: 15m

receivers:
  - name: rotas-operations
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
