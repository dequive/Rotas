global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: staging
    platform: rotas

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: rotas-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
