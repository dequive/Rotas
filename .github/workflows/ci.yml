name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "stabilization/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      PR06_RESTRICTED_DATABASE_URL: postgresql://rotas_app:rotas_app_dev@localhost:5432/rotas
      PR06_ADMIN_DATABASE_URL: postgresql://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Lint backend
        working-directory: backend
        run: >-
          .venv/bin/python -m ruff check app tests
          scripts/validate_release_governance.py
          scripts/pr06_rls_gate.py
      - name: Validate PR-00 release governance contract
        working-directory: backend
        run: >-
          .venv/bin/python -m scripts.validate_release_governance
          --policy ../infra/release/PR00_RELEASE_GOVERNANCE.json
          --repo-root ..
      - name: Typecheck backend
        working-directory: backend
        run: .venv/bin/python -m pyright --project pyright-ci.json
      - name: Run migrations
        working-directory: backend
        run: .venv/bin/python -m alembic upgrade head
      - name: Audit PR-06 database roles and tenant RLS
        working-directory: backend
        run: .venv/bin/python scripts/pr06_rls_gate.py
      - name: Test backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      VITE_ROTAS_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test manager
        run: npm --workspace apps/manager run test
      - name: Test driver
        run: npm --workspace apps/driver run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build manager
        run: npm --workspace apps/manager run build
      - name: Build driver
        run: npm --workspace apps/driver run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend]
    services:
      postgres:
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ROTAS_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3030
      E2E_EMAIL: e2e@rotas.local
      E2E_PASSWORD: E2eP@ss2024!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed E2E user
        working-directory: backend
        run: python -m pytest tests/seed_e2e.py -v

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Backend PID: $!"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/manager
        run: npm exec -- playwright install --with-deps chromium

      - name: Start Next.js dev server
        working-directory: apps/manager
        run: npm run dev &
        env:
          PORT: 3030

      - name: Wait for servers to be ready
        shell: bash
        run: |
          for url in http://localhost:8000/health http://localhost:3030; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent "$url" > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
          done

      - name: Run E2E tests
        working-directory: apps/manager
        run: npm exec -- playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/manager/playwright-report/
          retention-days: 30
