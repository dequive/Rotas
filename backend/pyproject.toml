[project]
name = "rotas-backend"
version = "0.1.0"
description = "ROTAS MVP modular FastAPI backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "PyJWT>=2.8",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.29",
  "arq>=0.28",
  "redis[asyncio]>=4.2,<6",
  "gunicorn>=22.0",
  "fpdf2>=2.8.7",
  "openpyxl>=3.1",
  "sentry-sdk[fastapi]>=2.61.1",
  "aiobotocore[boto3]>=3.7.0",
  "prometheus-fastapi-instrumentator>=7.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
