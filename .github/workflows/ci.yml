name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "stabilization/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Lint backend
        working-directory: backend
        run: .venv/bin/python -m ruff check app tests
      - name: Validate PR-00 release governance contract
        working-directory: backend
        run: >-
          .venv/bin/python -m scripts.validate_release_governance
          --policy ../infra/release/PR00_RELEASE_GOVERNANCE.json
          --repo-root ..
      - name: Typecheck backend
        working-directory: backend
        run: .venv/bin/python -m pyright --project pyright-ci.json
      - name: Verify versioned OpenAPI contract
        working-directory: backend
        run: .venv/bin/python scripts/export_openapi.py --check
      - name: Validate production-like staging policy
        working-directory: backend
        run: .venv/bin/python scripts/validate_staging_manifest.py
      - name: Validate observability policy
        working-directory: backend
        run: .venv/bin/python scripts/validate_observability.py
      - name: Validate backup and DR policy
        working-directory: backend
        run: .venv/bin/python -m scripts.validate_dr_policy
      - name: Validate performance budgets
        working-directory: backend
        run: .venv/bin/python -m scripts.validate_performance_policy
      - name: Validate production Python lock
        working-directory: backend
        run: .venv/bin/python -m scripts.validate_runtime_lock
      - name: Validate threat and privacy model
        working-directory: backend
        run: .venv/bin/python -m scripts.validate_security_model
      - name: Validate incident response and on-call contract
        working-directory: backend
        run: .venv/bin/python -m scripts.validate_incident_response
      - name: Lint staging promotion controls
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/validate_staging_manifest.py scripts/verify_staging_images.py scripts/verify_supply_chain.py scripts/staging_certification.py scripts/validate_observability.py scripts/observability_certification.py tests/test_staging_manifest.py tests/test_verify_staging_images.py tests/test_verify_supply_chain.py tests/test_staging_certification.py tests/test_observability_policy.py tests/test_observability_certification.py
      - name: Lint backup and DR controls
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/dr_common.py scripts/dr_backup.py scripts/dr_restore.py scripts/dr_retention.py scripts/validate_dr_policy.py scripts/dr_certification.py tests/test_dr_tooling.py tests/test_dr_certification.py
      - name: Lint performance gate
        working-directory: backend
        run: .venv/bin/python -m ruff check app/core/database_pool_metrics.py app/core/runtime_metrics.py app/gunicorn_conf.py scripts/performance_gate.py scripts/performance_certification.py scripts/export_pg_stat_statements.py scripts/validate_performance_policy.py scripts/validate_runtime_lock.py tests/test_performance_gate.py tests/test_performance_certification.py tests/test_database_pool_metrics.py tests/test_runtime_metrics.py tests/test_gunicorn_prometheus.py tests/test_runtime_dependency_policy.py tests/test_runtime_lock.py
      - name: Lint threat and privacy gate
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/validate_security_model.py scripts/security_certification.py tests/test_security_model.py tests/test_security_certification.py
      - name: Lint accessibility certification gate
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/accessibility_certification.py tests/test_accessibility_certification.py
      - name: Lint incident response gate
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/validate_incident_response.py scripts/incident_game_day.py scripts/incident_certification.py tests/test_incident_response.py tests/test_incident_certification.py
      - name: Lint release decision gate
        working-directory: backend
        run: >-
          .venv/bin/python -m ruff check
          scripts/validate_release_governance.py
          scripts/release_gate.py
          tests/test_release_governance.py
          tests/test_release_gate.py
      - name: Lint dependency security evidence gate
        working-directory: backend
        run: .venv/bin/python -m ruff check scripts/dependency_security_gate.py tests/test_dependency_security_gate.py tests/test_pr18_release_workflow.py tests/test_pr18_runtime_surface.py
      - name: Validate Prometheus rules
        run: |
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" --entrypoint promtool prom/prometheus@sha256:cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" --entrypoint promtool prom/prometheus@sha256:cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d check rules /etc/prometheus/rules/rotas-slo.rules.yml
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" --entrypoint promtool prom/prometheus@sha256:cff72a3f49918f41c4b5c8a6174dd8433036bebf7878120da538b3720ba3fa0d test rules /etc/prometheus/tests/rotas-slo.test.yml
      - name: Validate Alertmanager routing
        run: docker run --rm -v "$PWD/infra/observability:/etc/rotas-observability:ro" --entrypoint amtool prom/alertmanager@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286 check-config /etc/rotas-observability/alertmanager.yml
      - name: Render staging Compose baseline
        run: docker compose --env-file infra/staging/staging.env.example -f infra/staging/docker-compose.yml config --quiet
      - name: Run migrations
        working-directory: backend
        run: .venv/bin/python -m alembic upgrade head
      - name: Test backend
        working-directory: backend
        run: .venv/bin/python -m pytest -q --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      VITE_ROTAS_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Manager BFF boundary
        run: npm --workspace apps/manager run verify:bff
      - name: Verify production has no demo fallback
        run: npm --workspace apps/manager run verify:no-demo
      - name: Verify accessibility source contracts
        run: npm --workspace apps/manager run verify:accessibility
      - name: Test accessibility source gate
        run: npm --workspace apps/manager run test:accessibility
      - name: Test Manager BFF boundary gate
        run: npm --workspace apps/manager run test:bff-boundary
      - name: Verify generated API types
        run: npm --workspace apps/manager run check:api-types
      - name: Test manager
        run: npm --workspace apps/manager run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build manager
        run: npm --workspace apps/manager run build
      - name: Build driver
        run: npm --workspace apps/driver run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ROTAS_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3030
      E2E_EMAIL: e2e@rotas.local
      E2E_PASSWORD: E2eP@ss2024!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed E2E user
        working-directory: backend
        run: python -m pytest tests/seed_e2e.py -v

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Backend PID: $!"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/manager
        run: npx playwright install --with-deps chromium

      - name: Start Next.js dev server
        working-directory: apps/manager
        run: npm run dev &
        env:
          PORT: 3030

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:8000/health http://localhost:3030 --timeout 60000

      - name: Run E2E tests
        working-directory: apps/manager
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/manager/playwright-report/
          retention-days: 30
