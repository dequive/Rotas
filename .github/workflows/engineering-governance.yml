name: Engineering Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  issue-pr-contract:
    name: Issue PR Contract
    runs-on: ubuntu-latest
    steps:
      - name: Require Issue linkage and evidence sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: python
        run: |
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          blockers = []
          if not re.search(
              r"(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b",
              body,
          ):
              blockers.append("PR body must link its Issue with Closes #<number>.")

          required_sections = (
              "## Issue",
              "## Tipo",
              "## Mudancas e limites",
              "## Evidencia",
              "## Risco, seguranca e dados",
              "## Deploy e rollback",
              "## Certificacao",
          )
          for section in required_sections:
              if section.casefold() not in body.casefold():
                  blockers.append(f"Missing PR section: {section}.")

          if blockers:
              print("Engineering governance gate failed:")
              for blocker in blockers:
                  print(f"- {blocker}")
              sys.exit(1)

          print("Issue -> PR contract is valid.")
