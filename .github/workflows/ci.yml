name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate GitHub Actions supply-chain policy
        run: |
          python .github/scripts/test_validate_action_pins.py
          python .github/scripts/validate_action_pins.py .github/workflows
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests
      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      ROTAS_ALLOW_DEMO_FALLBACK: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      VITE_ROTAS_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build manager
        run: npm --workspace apps/manager run build
      - name: Build driver
        run: npm --workspace apps/driver run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rotas
          POSTGRES_USER: rotas
          POSTGRES_PASSWORD: rotas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rotas -d rotas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-secret-at-least-32-chars-long-abc
      DATABASE_URL: postgresql+asyncpg://rotas:rotas@localhost:5432/rotas
      ADMIN_DATABASE_URL: postgresql+asyncpg://rotas_admin:rotas_admin_dev@localhost:5432/rotas
      ALEMBIC_DATABASE_URL: postgresql+psycopg://rotas:rotas@localhost:5432/rotas
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: '["http://localhost:3030"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ROTAS_API_BASE_URL: http://localhost:8000
      ROTAS_ALLOW_DEMO_FALLBACK: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3030
      E2E_EMAIL: e2e@rotas.local
      E2E_PASSWORD: E2eP@ss2024!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database roles
        run: psql "$DATABASE_URL_PSQL" -f infra/postgres-init.sql
        env:
          DATABASE_URL_PSQL: postgresql://rotas:rotas@localhost:5432/rotas

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed E2E user
        working-directory: backend
        run: python -m pytest tests/seed_e2e.py -v

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Backend PID: $!"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/manager
        run: npx playwright install --with-deps chromium

      - name: Start Next.js dev server
        working-directory: apps/manager
        run: npm run dev &
        env:
          PORT: 3030

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:8000/health http://localhost:3030 --timeout 60000

      - name: Run E2E tests
        working-directory: apps/manager
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/manager/playwright-report/
          retention-days: 30
